    <!-- Instant warm gradient - appears before React hydrates -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, hsl(36 52% 90%) 0%, hsl(30 100% 98%) 100%);
      }
      
      /* Soft pulse animation for loading state */
      @keyframes soft-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      
      #root {
        min-height: 100vh;
      }
    </style>
