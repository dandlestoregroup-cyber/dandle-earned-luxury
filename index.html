<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dandle Recliners - Earn Your Comfort</title>
    <meta name="description" content="Experience earned luxury with Dandle's collection of premium recliners. Customizable designs, AR visualization, and white-glove delivery." />
    <meta name="author" content="Dandle Store Group" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Cairo:wght@600;700&family=Noto+Sans+Arabic:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600&display=swap" rel="stylesheet">
    
    <!-- Preload hero video for instant play -->
    <link rel="preload" href="/videos/festive-hero.mp4" as="video" type="video/mp4">
    
    <!-- Instant warm gradient - appears before React hydrates -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, hsl(36 52% 90%) 0%, hsl(30 100% 98%) 100%);
      }
      
      /* Soft pulse animation for loading state */
      @keyframes soft-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
      
      #root {
        min-height: 100vh;
      }
    </style>

    <meta property="og:title" content="DANDLE Recliners - Earned Luxury" />
    <meta property="og:description" content="Premium Egyptian recliners. Handcrafted in Cairo. 5-year warranty. Free delivery & installation across Egypt." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dandle-earned-luxury.lovable.app/" />
    <meta property="og:image" content="https://dandle-earned-luxury.lovable.app/dandle-og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="640" />
    <meta property="og:locale" content="en_EG" />
    <meta property="og:site_name" content="DANDLE Egypt" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@DandleEgypt" />
    <meta name="twitter:title" content="DANDLE Recliners - Earned Luxury" />

    <meta name="twitter:image" content="https://dandle-earned-luxury.lovable.app/dandle-og-image.jpg" />
    
    <link rel="canonical" href="https://dandle-earned-luxury.lovable.app/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
