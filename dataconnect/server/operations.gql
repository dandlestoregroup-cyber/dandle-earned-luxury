# Commerce writes are Admin-SDK-only. PayTabs/Take App verification remains in
# trusted server handlers; client state can never declare an order paid.

mutation CreateCommerceOrder(
  $reference: String!
  $customerAuthUid: String!
  $idempotencyKey: String!
  $sourceChannel: String!
  $currency: String!
  $totalAmountMinor: Int64!
  $cartSnapshot: Any!
  $contactSnapshot: Any!
) @auth(level: NO_ACCESS) @transaction {
  order_insert(data: {
    reference: $reference
    customerAuthUid: $customerAuthUid
    idempotencyKey: $idempotencyKey
    sourceChannel: $sourceChannel
    status: "pending"
    paymentStatus: "unpaid"
    currency: $currency
    totalAmountMinor: $totalAmountMinor
    cartSnapshot: $cartSnapshot
    contactSnapshot: $contactSnapshot
  })
}

mutation RecordPaymentAttempt(
  $attemptId: UUID!
  $orderReference: String!
  $provider: String!
  $providerProfileId: String
  $providerTransactionReference: String
  $idempotencyKey: String!
  $amountMinor: Int64!
  $currency: String!
  $status: String!
) @auth(level: NO_ACCESS) @transaction {
  query
  @redact
  @check(expr: "response.query.orders.size() == 1", message: "Payment attempt does not match exactly one order") {
    orders(where: {
      reference: { eq: $orderReference }
      totalAmountMinor: { eq: $amountMinor }
      currency: { eq: $currency }
      paymentStatus: { eq: "unpaid" }
    }, limit: 1) {
      reference
    }
  }
  paymentAttempt_insert(data: {
    attemptId: $attemptId
    orderReference: $orderReference
    provider: $provider
    providerProfileId: $providerProfileId
    providerTransactionReference: $providerTransactionReference
    idempotencyKey: $idempotencyKey
    amountMinor: $amountMinor
    currency: $currency
    status: $status
  })
  order_update(key: { reference: $orderReference }, data: {
    currentPaymentAttemptId: $attemptId
    updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "Order not found")
}

mutation RecordVerifiedPayment(
  $attemptId: UUID!
  $orderReference: String!
  $providerProfileId: String!
  $providerTransactionReference: String!
  $amountMinor: Int64!
  $currency: String!
) @auth(level: NO_ACCESS) @transaction {
  query
  @redact
  @check(expr: "response.query.orders.size() == 1 && response.query.paymentAttempts.size() == 1 && response.query.existingPaymentEvents.size() == response.query.matchingPaymentEvents.size()", message: "Verified payment does not match the current order attempt or immutable receipt") {
    orders(where: {
      reference: { eq: $orderReference }
      currentPaymentAttemptId: { eq: $attemptId }
      totalAmountMinor: { eq: $amountMinor }
      currency: { eq: $currency }
    }, limit: 1) {
      reference
    }
    paymentAttempts(where: {
      attemptId: { eq: $attemptId }
      orderReference: { eq: $orderReference }
      provider: { eq: "paytabs" }
      providerProfileId: { eq: $providerProfileId }
      providerTransactionReference: { eq: $providerTransactionReference }
      amountMinor: { eq: $amountMinor }
      currency: { eq: $currency }
    }, limit: 1) {
      attemptId
    }
    existingPaymentEvents: paymentEvents(where: {
      providerTransactionReference: { eq: $providerTransactionReference }
    }, limit: 1) {
      providerTransactionReference
    }
    matchingPaymentEvents: paymentEvents(where: {
      provider: { eq: "paytabs" }
      providerProfileId: { eq: $providerProfileId }
      orderReference: { eq: $orderReference }
      providerTransactionReference: { eq: $providerTransactionReference }
      authoritativeStatus: { eq: "paid" }
      amountMinor: { eq: $amountMinor }
      currency: { eq: $currency }
    }, limit: 1) {
      providerTransactionReference
    }
  }
  paymentEvent_upsert(data: {
    provider: "paytabs"
    providerProfileId: $providerProfileId
    orderReference: $orderReference
    providerTransactionReference: $providerTransactionReference
    eventType: "authoritative-verification"
    authoritativeStatus: "paid"
    amountMinor: $amountMinor
    currency: $currency
  })
  paymentAttempt_update(key: { attemptId: $attemptId }, data: {
    status: "paid"
    updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "Payment attempt not found")
  order_update(key: { reference: $orderReference }, data: {
    paymentStatus: "paid"
    updatedAt_expr: "request.time"
  }) @check(expr: "this != null", message: "Order not found")
}

mutation CaptureLead(
  $customerAuthUid: String!
  $source: String!
  $consentCaptured: Boolean!
  $details: Any!
) @auth(level: NO_ACCESS) @transaction {
  lead_insert(data: {
    leadId_expr: "uuidV4()"
    customerAuthUid: $customerAuthUid
    source: $source
    consentCaptured: $consentCaptured
    details: $details
    status: "captured"
  })
}

mutation QueueOperationsEvent(
  $eventId: String!
  $orderReference: String
  $eventType: String!
  $payload: Any!
) @auth(level: NO_ACCESS) @transaction {
  operationsEvent_insert(data: {
    eventId: $eventId
    orderReference: $orderReference
    eventType: $eventType
    payload: $payload
    deliveryStatus: "pending"
  })
}

mutation RecordMigrationCheckpoint(
  $sourceSystem: String!
  $cursor: String
  $sourceCount: Int64!
  $targetCount: Int64!
  $checksum: String!
  $completedAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  migrationCheckpoint_upsert(data: {
    sourceSystem: $sourceSystem
    cursor: $cursor
    sourceCount: $sourceCount
    targetCount: $targetCount
    checksum: $checksum
    completedAt: $completedAt
    updatedAt_expr: "request.time"
  })
}
