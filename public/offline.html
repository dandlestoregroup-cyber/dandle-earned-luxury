<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B85C38" />
    <title>DANDLE — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F7F1E8;color:#24211F;font-family:Inter,Arial,sans-serif}.card{max-width:430px;text-align:center;background:#fffaf4;border:1px solid #e3d8cb;border-radius:28px;padding:36px 28px;box-shadow:0 20px 60px rgba(45,35,29,.08)}.mark{width:72px;height:72px;border-radius:22px;background:#B85C38;color:#fff;display:grid;place-items:center;margin:0 auto 22px;font:700 38px Georgia,serif}.eyebrow{letter-spacing:.18em;font-size:11px;font-weight:700;color:#8a5a45}.title{font:600 36px/1.05 Georgia,serif;margin:12px 0}.copy{font-size:15px;line-height:1.6;color:#655e59;margin:0 0 24px}.button{display:inline-block;border:0;border-radius:999px;padding:13px 22px;background:#24211F;color:#fff;font:600 14px Inter,Arial,sans-serif;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">D</div>
      <div class="eyebrow">DANDLE</div>
      <h1 class="title">You’re offline.</h1>
      <p class="copy">Reconnect to see live products, prices, availability and Nour recommendations. DANDLE does not show cached product truth when it may be outdated.</p>
      <button class="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
