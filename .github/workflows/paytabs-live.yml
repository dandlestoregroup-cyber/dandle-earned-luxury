name: Deploy live PayTabs repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/paytabs-live.yml'
  pull_request:
    paths:
      - 'supabase/functions/paytabs-*/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/paytabs-live.yml'

permissions:
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment credential availability without revealing it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Live deployment blocked: repository secret SUPABASE_ACCESS_TOKEN is missing."
          else
            echo "Deployment token is configured; project permission is checked during deployment."
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Payment regression tests
        run: node --test tests/live-paytabs-policy.test.mjs tests/live-paytabs-handler.test.mjs
      - name: Check deployment access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing repository secret SUPABASE_ACCESS_TOKEN. No deployment was attempted."
            exit 41
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Deploy only the existing production payment functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy paytabs-create-payment --project-ref rbvbrxjnhmgrtxvwusxr
          supabase functions deploy paytabs-callback --project-ref rbvbrxjnhmgrtxvwusxr
      - name: Check public test requests are rejected without creating orders
        run: |
          node --input-type=module <<'JS'
          const res = await fetch('https://rbvbrxjnhmgrtxvwusxr.supabase.co/functions/v1/paytabs-create-payment', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({payment_test: true, test_reference: 'DN-PT50-00000000000000000000000000000000'})
          });
          if (res.status !== 403) throw new Error(`Expected operator-only rejection, got ${res.status}`);
          console.log('Live test-payment authorization verified. No payment created.');
          JS

  issue_checkout:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create exact 50 EGP hosted checkout link
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          REF="DN-PT50-$(echo "${GITHUB_SHA:0:32}" | tr '[:lower:]' '[:upper:]')"
          node scripts/paytabs-50egp.mjs "$REF"
