name: Dandle CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: dandle-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Payment security tests
        run: npm test

      - name: Data authority and Firebase SQL Connect source guards
        run: |
          npm run verify:data-backend
          npm run verify:firebase-sql-connect

      - name: Detect Data Connect changes
        id: dataconnect_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE"

          if git diff --quiet "$BASE" "$GITHUB_SHA" -- \
            dataconnect \
            firebase.json \
            scripts/verify-firebase-sql-connect-generated.mjs \
            .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Firebase SQL Connect schema and generated SDK boundary
        if: steps.dataconnect_changes.outputs.run == 'true'
        run: |
          npx --yes firebase-tools@15.30.2 dataconnect:sdk:generate --project demo-dandle-sql-connect --non-interactive
          npm run verify:firebase-sql-connect:generated

      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck Vercel APIs
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck --lib ES2022,DOM --types node api/*.ts api/_lib/*.ts api/public/paytabs/*.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Architecture guardrails
        shell: bash
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'Paymob|paymob_enabled|egypt\.onboarding\.paymob\.com' api src; then
            echo "Stale Paymob runtime/reference found. Dandle payment architecture is PayTabs with an InstaPay fallback."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'source: "manual-confirmation"|createdAt: new Date\(\)\.toISOString\(\).*totalPrice: "0"' api src/pages/OrderStatus.tsx; then
            echo "Fabricated order fallback detected."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'INSTAPAY_RECIPIENT_(NAME|ID)' src; then
            echo "Server-controlled InstaPay recipient configuration leaked into frontend source."
            exit 1
          fi
