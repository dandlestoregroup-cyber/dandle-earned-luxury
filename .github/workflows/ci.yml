name: Dandle CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/dandle-nour-vercel]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Payment security tests
        run: npm test

      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck all Vercel APIs
        shell: bash
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck --lib ES2022,DOM --types node $(find api -name '*.ts' -print)

      - name: Typecheck PayTabs runtime ESM
        shell: bash
        run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck --lib ES2022,DOM --types node api/_lib/catalog.ts api/_lib/order-access.ts api/_lib/paytabs.ts api/_lib/supabase-orders.ts api/public/paytabs/checkout.ts api/public/paytabs/status.ts api/public/paytabs/webhook.ts api/cron/paytabs-reconcile.ts api/integration-health.ts api/order-status.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Architecture guardrails
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE="api/public/paytabs api/cron/paytabs-reconcile.ts src/pages/Cart.tsx src/components/CheckoutForm.tsx src/pages/PaymentResult.tsx src/pages/OrderStatus.tsx"
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'Paymob|paymob_enabled|egypt\.onboarding\.paymob\.com|Stripe|Lemon Squeezy' $ACTIVE; then
            echo "Non-PayTabs provider found in the active Dandle checkout surface."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'InstaPay|instapay|40%|Remaining 60%|deposit' $ACTIVE; then
            echo "Legacy/manual payment flow found in the active Dandle checkout surface."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'PAYTABS_SERVER_KEY|serverKey' src; then
            echo "PayTabs server secret reference leaked into frontend source."
            exit 1
          fi
          if ! grep -q 'https://secure-egypt.paytabs.com' api/_lib/paytabs.ts; then
            echo "Egypt PayTabs API base is not locked."
            exit 1
          fi
          if ! grep -q '/api/public/paytabs/webhook' api/_lib/paytabs.ts; then
            echo "Production PayTabs callback route is missing."
            exit 1
          fi
          EXTENSIONLESS="$(grep -RhE 'from "\.\.?/[^\"]+";' api/public/paytabs api/cron/paytabs-reconcile.ts api/_lib/paytabs.ts 2>/dev/null | grep -vE '\.(js|ts)";' || true)"
          if [ -n "$EXTENSIONLESS" ]; then
            echo "$EXTENSIONLESS"
            echo "Extensionless runtime import found in PayTabs Vercel path."
            exit 1
          fi
          if grep -Rni -E '^export default async function handler' api/public/paytabs api/cron/paytabs-reconcile.ts api/order-status.ts; then
            echo "Legacy Vercel handler signature found in payment/status routes."
            exit 1
          fi
          grep -q 'export async function POST' api/public/paytabs/checkout.ts
          grep -q 'export async function POST' api/public/paytabs/webhook.ts
          grep -q 'export async function GET' api/public/paytabs/status.ts
          grep -q 'export async function GET' api/cron/paytabs-reconcile.ts
          grep -q 'export async function GET' api/order-status.ts

          for retired in api/order-intent.ts api/payment-intent.ts api/instapay-intent.ts api/instapay-submit.ts api/paytabs-callback.ts; do
            if [ -e "$retired" ]; then
              echo "Retired payment/order endpoint still deploys: $retired"
              exit 1
            fi
          done

          grep -q 'id-token: write' .github/workflows/paytabs-reconcile.yml
          grep -q 'ACTIONS_ID_TOKEN_REQUEST_TOKEN' .github/workflows/paytabs-reconcile.yml
          grep -q 'audience=dandle-paytabs-reconcile' .github/workflows/paytabs-reconcile.yml
          grep -q 'GITHUB_WORKFLOW_REF' api/cron/paytabs-reconcile.ts
          grep -q 'verifySignature("RSA-SHA256"' api/cron/paytabs-reconcile.ts
          if grep -Rni 'CRON_SECRET' .github/workflows/paytabs-reconcile.yml api/cron/paytabs-reconcile.ts api/integration-health.ts; then
            echo "Reconciliation still depends on a static cron secret."
            exit 1
          fi

          FUNCTION_COUNT="$(find api -type f -name '*.ts' ! -path 'api/_lib/*' | wc -l | tr -d ' ')"
          echo "Vercel serverless function count: ${FUNCTION_COUNT}"
          if [ "$FUNCTION_COUNT" -gt 12 ]; then
            echo "Vercel Hobby supports at most 12 serverless functions for this project."
            exit 1
          fi

      - name: Apply additive PayTabs production migration
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/paytabs-production')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository."
            exit 41
          fi
          MIGRATION="supabase/migrations/20260904160000_paytabs_production_orders.sql"
          jq -Rs '{query:.}' "$MIGRATION" > /tmp/paytabs-migration.json
          curl --fail-with-body -sS \
            --request POST \
            "https://api.supabase.com/v1/projects/rbvbrxjnhmgrtxvwusxr/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/paytabs-migration.json \
            > /tmp/paytabs-migration-result.json
          echo "PayTabs migration request succeeded."

      - name: Verify PayTabs production migration
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/paytabs-production')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          QUERY="select to_regclass('public.dandle_orders')::text as table_name, to_regprocedure('public.settle_dandle_paytabs_order(uuid,text,jsonb)')::text as settlement_function;"
          jq -n --arg query "$QUERY" '{query:$query}' > /tmp/paytabs-verify.json
          RESULT="$(curl --fail-with-body -sS \
            --request POST \
            "https://api.supabase.com/v1/projects/rbvbrxjnhmgrtxvwusxr/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/paytabs-verify.json)"
          echo "$RESULT" | grep -q 'dandle_orders'
          echo "$RESULT" | grep -q 'settle_dandle_paytabs_order'
          echo "PayTabs order table and settlement function verified."
