name: Dandle CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/dandle-nour-vercel]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Payment security tests
        run: npm test

      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck Vercel APIs
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck --lib ES2022,DOM --types node api/*.ts api/_lib/*.ts api/public/paytabs/*.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Architecture guardrails
        shell: bash
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'Paymob|paymob_enabled|egypt\.onboarding\.paymob\.com' api src; then
            echo "Stale Paymob runtime/reference found. Dandle payment architecture is PayTabs with an InstaPay fallback."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'source: "manual-confirmation"|createdAt: new Date\(\)\.toISOString\(\).*totalPrice: "0"' api src/pages/OrderStatus.tsx; then
            echo "Fabricated order fallback detected."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'INSTAPAY_RECIPIENT_(NAME|ID)' src; then
            echo "Server-controlled InstaPay recipient configuration leaked into frontend source."
            exit 1
          fi

      - name: Deploy final live Supabase payment patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/live-supabase-final'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository."
            exit 41
          fi
          npx --yes supabase@latest functions deploy get-order-status --project-ref rbvbrxjnhmgrtxvwusxr --no-verify-jwt
          npx --yes supabase@latest functions deploy instapay-intent --project-ref rbvbrxjnhmgrtxvwusxr --no-verify-jwt

      - name: Smoke test live Supabase payment patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/live-supabase-final'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://rbvbrxjnhmgrtxvwusxr.supabase.co/functions/v1"

          STATUS_JSON="$(curl --fail-with-body -sS "$BASE/get-order-status" -H 'Content-Type: application/json' --data '{"reference":"DN-MT4IDQ65-W805"}')"
          echo "ORDER_STATUS=$STATUS_JSON"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.error && /Invalid order reference/.test(x.error)) process.exit(2)' "$STATUS_JSON"

          INSTAPAY_JSON="$(curl --fail-with-body -sS "$BASE/instapay-intent" -H 'Content-Type: application/json' --data '{"probe":true}')"
          echo "INSTAPAY_PROBE=$INSTAPAY_JSON"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.available !== true) process.exit(3)' "$INSTAPAY_JSON"
