name: Dandle CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/dandle-nour-vercel]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Payment security tests
        run: npm test

      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck all Vercel APIs
        shell: bash
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck --lib ES2022,DOM --types node $(find api -name '*.ts' -print)

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Architecture guardrails
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'Paymob|paymob_enabled|egypt\.onboarding\.paymob\.com|Stripe|Lemon Squeezy' api/public api/cron src/pages/Cart.tsx src/components/CheckoutForm.tsx src/pages/PaymentResult.tsx; then
            echo "Non-PayTabs provider found in the active Dandle checkout surface."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'InstaPay|instapay' api/public api/cron src/pages/Cart.tsx src/components/CheckoutForm.tsx src/pages/PaymentResult.tsx; then
            echo "Manual payment fallback found in the active Dandle checkout surface."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'PAYTABS_SERVER_KEY|serverKey' src; then
            echo "PayTabs server secret reference leaked into frontend source."
            exit 1
          fi
          if ! grep -q 'https://secure-egypt.paytabs.com' api/_lib/paytabs.ts; then
            echo "Egypt PayTabs API base is not locked."
            exit 1
          fi
          if ! grep -q '/api/public/paytabs/webhook' api/_lib/paytabs.ts; then
            echo "Production PayTabs callback route is missing."
            exit 1
          fi
