name: Dandle CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/dandle-nour-vercel]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm install
          # The existing npm lock/install tree omits this declared runtime dependency on npm 11.
          # Install the already-pinned version explicitly so CI can verify the application while
          # the repository continues to use its normal Vercel/Bun-compatible dependency metadata.
          npm install --no-save react-router-dom@6.30.1

      - name: Payment security tests
        run: npm test

      - name: Dependency sanity
        run: |
          npm ls react-router-dom
          node -e "console.log(require('react-router-dom/package.json').version)"
          test -f node_modules/react-router-dom/dist/index.d.ts

      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck Vercel APIs
        run: npx tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --skipLibCheck --lib ES2022,DOM --types node api/*.ts api/_lib/*.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Architecture guardrails
        shell: bash
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'Paymob|paymob_enabled|egypt\.onboarding\.paymob\.com' api src; then
            echo "Stale Paymob runtime/reference found. Dandle payment architecture is PayTabs with an InstaPay fallback."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'source: "manual-confirmation"|createdAt: new Date\(\)\.toISOString\(\).*totalPrice: "0"' api src/pages/OrderStatus.tsx; then
            echo "Fabricated order fallback detected."
            exit 1
          fi
          if grep -Rni --exclude-dir=node_modules --exclude-dir=.git -E 'INSTAPAY_RECIPIENT_(NAME|ID)' src; then
            echo "Server-controlled InstaPay recipient configuration leaked into frontend source."
            exit 1
          fi
